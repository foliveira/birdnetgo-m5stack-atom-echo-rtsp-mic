name: Auto Tag Release

on:
  push:
    branches: [main]
    paths:
      - 'src/esp32_rtsp_mic_birdnetgo.ino'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract FW_VERSION
        id: version
        run: |
          VERSION=$(grep -oP '#define FW_VERSION "\K[^"]+' src/esp32_rtsp_mic_birdnetgo.ino)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} already exists, skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} is new, will release."
          fi

      - name: Host unit tests
        if: steps.check.outputs.exists == 'false'
        run: sh test/host/run.sh

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: '22'

      - name: Web UI API keys match the firmware
        if: steps.check.outputs.exists == 'false'
        run: node test/webui/check_keys.mjs

      - name: Web UI behaviour (headless Chrome against the mock device)
        if: steps.check.outputs.exists == 'false'
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu '--remote-allow-origins=*' --remote-debugging-port=9222 about:blank &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9222/json/version >/dev/null && break; sleep 1; done
          node test/webui/ui_test.mjs

      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'false'
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        if: steps.check.outputs.exists == 'false'
        uses: actions/cache@v4
        with:
          # sdkconfig.defaults carries the hash of the ESP-IDF libraries pioarduino rebuilt for
          # custom_sdkconfig; without it every run reinstalls and rebuilds them.
          path: |
            ~/.platformio
            !~/.platformio/.cache
            ~/.cache/pip
            sdkconfig.defaults
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        if: steps.check.outputs.exists == 'false'
        run: pip install platformio

      - name: Build firmware
        if: steps.check.outputs.exists == 'false'
        run: pio run

      - name: Collect binaries
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p release

          cp .pio/build/m5stack-atom/firmware.bin   release/firmware.bin
          # For decoding crash backtraces (the device logs them after a crash); not flashed.
          cp .pio/build/m5stack-atom/firmware.elf   release/firmware.elf
          cp .pio/build/m5stack-atom/bootloader.bin release/bootloader.bin
          cp .pio/build/m5stack-atom/partitions.bin release/partitions.bin

          BOOT_APP=$(find ~/.platformio/packages -name "boot_app0.bin" | head -1)
          if [ -z "$BOOT_APP" ]; then
            echo "ERROR: boot_app0.bin not found"
            exit 1
          fi
          cp "$BOOT_APP" release/boot_app0.bin

          echo "--- Binary sizes ---"
          ls -lh release/

      - name: Create tag and GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: release/*
          generate_release_notes: true
