; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-atom]
; Pinned: an unpinned platform silently changes the toolchain and Arduino core under CI.
; pioarduino's platform: Arduino-ESP32 3.3.12 on ESP-IDF 5.5.5. The official espressif32
; platform stops at Arduino 2.0.17 (ESP-IDF 4.4, end of life).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-atom
framework = arduino
monitor_speed = 115200
; Gzips web/index.html into a header WebUI.cpp includes (see the script).
extra_scripts = pre:scripts/embed_webui.py
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Unused Update encrypted-image mode, which otherwise "decrypts" any file not starting with 0xE9.
    -DUPDATE_NOCRYPT
; pioarduino rebuilds the core's ESP-IDF libraries with these options. The first build downloads
; ESP-IDF and takes several minutes; later builds reuse the libraries while the sdkconfig.defaults
; it writes next to this file matches.
; TCP send buffer 16 KB instead of 5744 B: with WiFi power save on, acknowledgements arrive once per
; DTIM period, so one DTIM period carries at most one buffer (32 kHz needs 6.6 KB per 102.4 ms).
; TCP timer 100 ms instead of 250 ms. lwIP's retransmission timer counts ticks of twice this
; interval and does not go below 3 ticks, so with 250 ms a lost segment is resent 1.0 to 1.5 s after
; it was sent and again 3 s later; with 100 ms, after 0.4 to 0.6 s and again 1.2 s later. The frame
; pool holds about 1.5 s of audio at 32 kHz on this board, so the default loses audio on a single
; lost segment. Worked out from lwIP's source (RTT estimate in tcp_in.c, tcp_slowtmr in tcp.c), not
; measured on a device.
custom_sdkconfig =
    CONFIG_LWIP_TCP_SND_BUF_DEFAULT=16384
    CONFIG_LWIP_TCP_TMR_INTERVAL=100
