; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-atom]
; Pinned: an unpinned platform silently changes the toolchain and Arduino core under CI.
; pioarduino's platform: Arduino-ESP32 3.3.12 on ESP-IDF 5.5.5. The official espressif32
; platform stops at Arduino 2.0.17 (ESP-IDF 4.4, end of life).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-atom
framework = arduino
monitor_speed = 115200
; Gzips web/index.html into a header WebUI.cpp includes (see the script).
extra_scripts = pre:scripts/embed_webui.py
build_flags =
    -DCORE_DEBUG_LEVEL=1
